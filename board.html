<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>익명게시판 · 동래아 공동육아</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="wrap single">
  <nav class="site-nav" id="siteNav" data-page="board" aria-label="메뉴"></nav>
  <main>
    <section class="slot" id="board">
      <div class="slot-h"><h1>🤫 익명게시판</h1><span class="rule">이름 없이 남겨져요. 아이 이름은 적지 말아 주세요</span></div>
      <p class="hint">단톡방에서 말하기 쑥스러운 것도 편하게 적어 주세요. 배웠으면 하는 행동, 해 봤으면 하는 경험, 아무 이야기나 다 좋아요. 같이 놀 날은 <a href="meet.html">모임 요청</a>에 올려 주세요.</p>
      <div class="toolbar" id="opTabs" role="group" aria-label="게시판 주제">
        <button class="chip" data-topic="habit" aria-pressed="true">① 배웠으면 하는 행동</button>
        <button class="chip" data-topic="dev" aria-pressed="false">② 해 봤으면 하는 경험</button>
        <button class="chip" data-topic="free" aria-pressed="false">💬 자유</button>
      </div>
      <form class="board-form" id="opForm">
        <div id="playField">
          <label class="label" for="opPlay">어떤 놀이에 대한 이야기인가요? (선택)</label>
          <select id="opPlay"></select>
        </div>
        <label class="label" for="opText">내용</label>
        <textarea id="opText" maxlength="500" placeholder=""></textarea>
        <div class="board-row">
          <span class="hint" id="opCount">0 / 500</span>
          <button class="btn primary" type="submit" id="opSend">익명으로 남기기</button>
        </div>
        <p class="toast" id="opMsg" aria-live="polite"></p>
      </form>
      <ul class="ops" id="opList"></ul>
      <p class="hint" id="opEmpty"></p>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="plays.js"></script>
<script src="assets/common.js"></script>
<script src="assets/board.js"></script>
</body>
</html>
