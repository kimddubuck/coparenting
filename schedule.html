<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일정·공지 · 동래아 공동육아</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="wrap single">
  <nav class="site-nav" id="siteNav" data-page="schedule" aria-label="메뉴"></nav>
  <main>
    <header class="page-h">
      <h1>일정·공지</h1>
      <p class="sub">편할 때 오고 가는 자유 참여예요. 준비물은 없어도 괜찮아요.</p>
    </header>

    <section class="sec">
      <h2>다가오는 모임</h2>
      <ul class="events" id="upcoming"></ul>
      <p class="hint" id="upcomingEmpty" hidden>아직 정해진 모임이 없어요. 단톡방 공지를 기다려 주세요.</p>
    </section>

    <section class="sec">
      <h2>⚡ 번개</h2>
      <ul class="events" id="meets"></ul>
      <p class="hint" id="meetsEmpty"></p>
      <p><a class="btn" href="board.html#meet">⚡ 번개 올리러 가기</a></p>
    </section>

    <section class="sec">
      <h2>지난 모임</h2>
      <ul class="events" id="past"></ul>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="schedule.js"></script>
<script src="assets/common.js"></script>
<script src="assets/schedule.js"></script>
<script>
const today = todayStr(), all = sortedSchedule();
const up = all.filter(e => e.date >= today), past = all.filter(e => e.date < today).reverse();
$('#upcoming').innerHTML = up.map(e => scheduleItem(e, true)).join('');
$('#upcomingEmpty').hidden = up.length > 0;
$('#past').innerHTML = past.map(e => scheduleItem(e, true)).join('');
watchMeets(list => {
  const ul = $('#meets'); ul.innerHTML = '';
  if(list === null){ $('#meetsEmpty').textContent = '번개를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  list.forEach(o => ul.appendChild(meetItem(o)));
  $('#meetsEmpty').textContent = list.length ? '' : '다가오는 번개가 없어요.';
});
</script>
</body>
</html>
