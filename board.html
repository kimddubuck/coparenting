<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>익명게시판 · 동래아 공동육아</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="wrap single">
  <nav class="site-nav" id="siteNav" data-page="board" aria-label="메뉴"></nav>
  <main>
    <section class="slot" id="board">
      <div class="slot-h"><h1>🤫 익명게시판</h1><span class="rule">이름 없이 남겨져요. 아이 이름은 적지 말아 주세요</span></div>
      <p class="hint">단톡방에서 말하기 쑥스러운 것도 편하게 적어 주세요. 배웠으면 하는 행동, 해 봤으면 하는 경험, 같이 놀 번개까지 다 좋아요.</p>
      <div class="toolbar" id="opTabs" role="group" aria-label="게시판 주제">
        <button class="chip" data-topic="habit" aria-pressed="true">① 배웠으면 하는 행동</button>
        <button class="chip" data-topic="dev" aria-pressed="false">② 해 봤으면 하는 경험</button>
        <button class="chip" data-topic="meet" aria-pressed="false">⚡ 번개 요청</button>
        <button class="chip" data-topic="free" aria-pressed="false">💬 자유</button>
      </div>
      <form class="board-form" id="opForm">
        <div id="playField">
          <label class="label" for="opPlay">어떤 놀이에 대한 이야기인가요? (선택)</label>
          <select id="opPlay"></select>
        </div>
        <div id="meetExample" class="example" hidden>
          <p class="label">이렇게 올리면 돼요 (예시)</p>
          <div class="example-card">
            <span class="op-when">⚡ 10/7 (수) 오전</span>
            <p class="op-text">장소: 2단지 커뮤니티
시간: 10시쯤
놀이: 뽁뽁이 놀이 해요 (준비물 없어도 OK)</p>
            <span class="join" aria-hidden="true">🙋 나도 갈래요 · 2명</span>
          </div>
        </div>
        <div id="meetFields" class="meet-fields" hidden>
          <div class="meet-row">
            <label class="label" for="opDate">날짜</label>
            <input type="date" id="opDate">
          </div>
          <div class="meet-row">
            <span class="label">시간대</span>
            <div class="toolbar" id="opSlot" role="group" aria-label="시간대">
              <button type="button" class="chip" data-slot="오전" aria-pressed="true">오전</button>
              <button type="button" class="chip" data-slot="점심" aria-pressed="false">점심</button>
              <button type="button" class="chip" data-slot="오후" aria-pressed="false">오후</button>
              <button type="button" class="chip" data-slot="저녁" aria-pressed="false">저녁</button>
            </div>
          </div>
        </div>
        <label class="label" for="opText" id="opTextLabel">내용</label>
        <textarea id="opText" maxlength="500" placeholder=""></textarea>
        <div class="board-row">
          <span class="hint" id="opCount">0 / 500</span>
          <button class="btn primary" type="submit" id="opSend">익명으로 남기기</button>
        </div>
        <p class="toast" id="opMsg" aria-live="polite"></p>
      </form>
      <ul class="ops" id="opList"></ul>
      <p class="hint" id="opEmpty"></p>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="plays.js"></script>
<script src="assets/common.js"></script>
<script src="assets/board.js"></script>
</body>
</html>
